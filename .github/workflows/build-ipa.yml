on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Прямая ссылка на расшифрованный SoundCloud .ipa (пусто = релиз base-ipa этого репозитория)'
        required: false
        default: ''
        type: string
      strip_extra:
        description: 'Жёсткая очистка базового IPA: удалить ВСЕ посторонние dylib (если база уже с модом). Выключай, только если база чистая.'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'waruhachi/theos'
          theos-branch: 'main'
          sdks-src: 'waruhachi/sdks'
          sdks-branch: 'main'

      # Для IPA нужен rootful-билд (пути /Library/...), только arm64:
      # armv7/armv7s на современных SDK не собираются и в IPA не нужны.
      - name: Build tweak (rootful, arm64)
        run: |
          make clean package FINALPACKAGE=1 ARCHS="arm64" TARGET="iphone:clang:latest:15.0"

      - name: Collect dylib and resource bundle
        run: |
          set -euo pipefail
          STAGE=$(find .theos -type d -path '*/Library/MobileSubstrate/DynamicLibraries' | head -n 1)
          test -n "$STAGE" || { echo "::error::staging dir not found"; exit 1; }
          test -f "$STAGE/SCMusicPlus.dylib" || { echo "::error::SCMusicPlus.dylib not built"; exit 1; }
          test -f "$STAGE/SCMusicPlus.bundle/app.html" || { echo "::error::SCMusicPlus.bundle is missing or incomplete"; exit 1; }
          test -f "$STAGE/SCMusicPlus.bundle/Web/ext/content.js" || { echo "::error::Web/ext files missing in bundle"; exit 1; }
          rm -rf inject && mkdir -p inject
          cp "$STAGE/SCMusicPlus.dylib" inject/
          cp -R "$STAGE/SCMusicPlus.bundle" inject/
          lipo -info inject/SCMusicPlus.dylib
          otool -L inject/SCMusicPlus.dylib

      - name: Get base SoundCloud IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf base && mkdir -p base
          if [ -n "$IPA_URL" ]; then
            echo "Downloading from input URL"
            curl -L --fail --retry 3 -o base/SoundCloud.ipa "$IPA_URL"
          else
            echo "Downloading from release 'base-ipa' of $GITHUB_REPOSITORY"
            gh release download base-ipa --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --dir base --clobber \
              || { echo "::error::Нет ipa_url и нет релиза base-ipa с .ipa. Укажи ссылку или загрузи .ipa в релиз с тегом base-ipa."; exit 1; }
            FIRST=$(ls base/*.ipa | head -n 1)
            [ "$FIRST" = "base/SoundCloud.ipa" ] || mv "$FIRST" base/SoundCloud.ipa
          fi
          ls -lh base/
          unzip -tq base/SoundCloud.ipa >/dev/null || { echo "::error::Файл не является корректным zip/ipa (проверь ссылку — это должен быть прямой линк на файл)"; exit 1; }

      - name: Validate base IPA (bundle id, not encrypted)
        run: |
          set -euo pipefail
          rm -rf chk && mkdir chk
          unzip -q base/SoundCloud.ipa -d chk
          APP=$(find chk/Payload -maxdepth 1 -type d -name '*.app' | head -n 1)
          test -n "$APP" || { echo "::error::В ipa нет Payload/*.app"; exit 1; }
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          echo "bundle id: $BID, version: $VER, executable: $EXE"
          if [ "$BID" != "com.soundcloud.TouchApp" ]; then
            echo "::warning::bundle id = $BID, а твик фильтруется по com.soundcloud.TouchApp"
          fi
          if otool -l "$APP/$EXE" | grep -A4 LC_ENCRYPTION_INFO | grep -q 'cryptid 1'; then
            echo "::error::IPA зашифрован (cryptid 1) — это App Store ipa. Нужен расшифрованный."
            exit 1
          fi
          echo "--- уже внедрённые в базовый IPA dylib/фреймворки (кроме системных фреймворков приложения):"
          find "$APP" -maxdepth 3 -name '*.dylib' || true
          if find "$APP" -maxdepth 3 \( -name '*.dylib' -o -iname '*substrate*' -o -iname '*ellekit*' \) | grep -q .; then
            echo "::warning::В базовом IPA уже есть чужие dylib/твики — они могут конфликтовать с SCMusicPlus. Лучше взять чистый расшифрованный IPA."
          fi
          rm -rf chk

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cyan (pyzule-rw) and ldid
        run: |
          set -euo pipefail
          brew install ldid
          pip install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          cyan --help | head -n 40

      # Если базовый IPA уже модифицирован (чужие dylib, Substrate/ElleKit, старая копия SCMusicPlus), приложение
      # не запускается: двойная инъекция или «Library not loaded». Чистим базу перед инъекцией.
      - name: Sanitize base IPA (remove foreign tweaks)
        env:
          STRICT: ${{ inputs.strip_extra }}
        run: |
          set -euo pipefail
          ARGS=""
          [ "$STRICT" = "true" ] && ARGS="--strict"
          cat > "$RUNNER_TEMP/sanitize_ipa.py" <<'PYEOF'
          #!/usr/bin/env python3
          """Чистит базовый SoundCloud .ipa от чужих модов перед инъекцией SCMusicPlus.

          Что делает:
            * удаляет из .app известные tweak-библиотеки (Substrate/ElleKit/libhooker/Frida, старые копии SCMusicPlus ...);
            * в strict-режиме удаляет вообще любые «лишние» *.dylib в корне .app и в Frameworks (кроме libswift*/libclang_rt*);
            * вырезает из главного Mach-O load-команды, ссылающиеся на удалённое или на несуществующие библиотеки
              (иначе dyld не запустит приложение: "Library not loaded");
            * печатает отчёт (markdown) — его видно в Summary запуска workflow.

          Только стандартная библиотека Python. Для распаковки/упаковки используются системные unzip/zip (сохраняют symlink'и и права).
          """
          import argparse, os, plistlib, re, shutil, struct, subprocess, sys, tempfile

          DYLIB_CMDS = {0x0C: 'LOAD_DYLIB', 0x80000018: 'LOAD_WEAK_DYLIB', 0x8000001F: 'REEXPORT_DYLIB',
                        0x20: 'LAZY_LOAD_DYLIB', 0x80000023: 'LOAD_UPWARD_DYLIB'}
          LC_RPATH = 0x8000001C

          DENY = re.compile(r'(substrate|ellekit|substitute|libhooker|cydia|frida|scmusicplus|sideload|cephei|rocketbootstrap|'
                            r'libsparkapplist|libcolorpicker|tweakinject|injectdylib|dobby|fishhook)', re.I)
          KEEP_LOOSE = re.compile(r'^(libswift|libclang_rt|libc\+\+|libobjc|libsystem)', re.I)


          def is_system(path):
              return path.startswith('/usr/lib/') or path.startswith('/System/') or path.startswith('/usr/')


          def macho_slices(buf):
              """Список (offset) 64-битных little-endian slice'ов в файле (thin или fat)."""
              if len(buf) < 8:
                  return []
              magic_be = struct.unpack_from('>I', buf, 0)[0]
              if magic_be in (0xCAFEBABE, 0xCAFEBABF):
                  n = struct.unpack_from('>I', buf, 4)[0]
                  res = []
                  for i in range(n):
                      if magic_be == 0xCAFEBABE:
                          _, _, off, size, _ = struct.unpack_from('>iiIII', buf, 8 + 20 * i)
                      else:
                          _, _, off, size, _, _ = struct.unpack_from('>iiQQII', buf, 8 + 32 * i)
                      res.append(off)
                  return [o for o in res if struct.unpack_from('<I', buf, o)[0] == 0xFEEDFACF]
              if struct.unpack_from('<I', buf, 0)[0] == 0xFEEDFACF:
                  return [0]
              return []


          def load_commands(buf, off):
              ncmds, sizeofcmds = struct.unpack_from('<II', buf, off + 16)
              p = off + 32
              cmds = []
              for _ in range(ncmds):
                  cmd, size = struct.unpack_from('<II', buf, p)
                  cmds.append((cmd, size, p))
                  p += size
              return ncmds, sizeofcmds, cmds


          def dylib_path(buf, cmd_pos, size):
              name_off = struct.unpack_from('<I', buf, cmd_pos + 8)[0]
              return bytes(buf[cmd_pos + name_off:cmd_pos + size]).split(b'\0')[0].decode('utf8', 'replace')


          def list_dylibs(buf):
              out = []
              for off in macho_slices(buf)[:1]:
                  _, _, cmds = load_commands(buf, off)
                  for cmd, size, pos in cmds:
                      if cmd in DYLIB_CMDS:
                          out.append((DYLIB_CMDS[cmd], dylib_path(buf, pos, size)))
                      elif cmd == LC_RPATH:
                          out.append(('RPATH', dylib_path(buf, pos, size)))
              return out


          def strip_dylibs(buf, should_remove):
              """Вырезает dylib load-команды, для которых should_remove(path) истинно. Возвращает список удалённых путей."""
              removed_all = []
              for off in macho_slices(buf):
                  ncmds, sizeofcmds, cmds = load_commands(buf, off)
                  kept = bytearray()
                  removed = []
                  for cmd, size, pos in cmds:
                      if cmd in DYLIB_CMDS:
                          path = dylib_path(buf, pos, size)
                          if should_remove(path):
                              removed.append(path)
                              continue
                      kept += buf[pos:pos + size]
                  if removed:
                      start = off + 32
                      buf[start:start + sizeofcmds] = bytes(kept) + b'\0' * (sizeofcmds - len(kept))
                      struct.pack_into('<II', buf, off + 16, ncmds - len(removed), len(kept))
                      removed_all += removed
              return removed_all


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument('src')
              ap.add_argument('dst')
              ap.add_argument('--strict', action='store_true', help='удалять любые лишние *.dylib, не только известные tweak-библиотеки')
              ap.add_argument('--report', default='sanitize-report.md')
              a = ap.parse_args()

              work = tempfile.mkdtemp(prefix='sanitize_')
              subprocess.check_call(['unzip', '-q', a.src, '-d', work])
              payload = os.path.join(work, 'Payload')
              apps = [d for d in os.listdir(payload) if d.endswith('.app')]
              if not apps:
                  sys.exit('::error::В IPA нет Payload/*.app')
              app = os.path.join(payload, apps[0])
              with open(os.path.join(app, 'Info.plist'), 'rb') as f:
                  info = plistlib.load(f)
              exe_name = info['CFBundleExecutable']
              exe = os.path.join(app, exe_name)
              rep = ['## Очистка базового IPA', '',
                     f"- bundle id: `{info.get('CFBundleIdentifier')}`, версия: `{info.get('CFBundleShortVersionString')}` ({info.get('CFBundleVersion')})",
                     f"- режим: {'strict (удаляются любые лишние dylib)' if a.strict else 'обычный (только известные tweak-библиотеки)'}", '']

              fw_dir = os.path.join(app, 'Frameworks')
              removed_files = []   # basenames удалённых файлов/папок

              def rm(path):
                  rel = os.path.relpath(path, app)
                  shutil.rmtree(path) if os.path.isdir(path) and not os.path.islink(path) else os.remove(path)
                  removed_files.append(os.path.basename(path))
                  rep.append(f'- удалено: `{rel}`')

              rep.append('### Удалённые файлы')
              n_before = len(rep)
              scan_dirs = [app] + ([fw_dir] if os.path.isdir(fw_dir) else [])
              for d in scan_dirs:
                  for name in sorted(os.listdir(d)):
                      path = os.path.join(d, name)
                      low = name.lower()
                      if low.endswith('.dylib'):
                          if DENY.search(name) or (a.strict and not KEEP_LOOSE.match(name)):
                              rm(path)
                      elif low.endswith('.framework') and d == fw_dir:
                          if DENY.search(name):
                              rm(path)
                      elif low.endswith('.bundle') and DENY.search(name):
                          rm(path)
              if len(rep) == n_before:
                  rep.append('- ничего')
              rep.append('')

              with open(exe, 'rb') as f:
                  buf = bytearray(f.read())
              rep.append('### Load-команды главного бинарника ДО')
              before = list_dylibs(buf)
              for kind, p in before:
                  rep.append(f'- {kind}: `{p}`')
              rep.append('')

              def exists_in_bundle(path):
                  m = re.match(r'@(?:rpath|executable_path|loader_path)/(.+)', path)
                  if not m:
                      return True
                  rel = m.group(1)
                  return any(os.path.exists(os.path.join(base, rel)) for base in (fw_dir, app))

              def should_remove(path):
                  base = os.path.basename(path)
                  if DENY.search(path):          # проверяем раньше is_system: бывают ссылки вида /usr/lib/libsubstrate.dylib
                      return True
                  if is_system(path):
                      return False
                  if base in removed_files or any(('/' + r + '/') in path for r in removed_files):
                      return True
                  if base.startswith('libswift') or base.startswith('libclang_rt'):
                      return False
                  return not exists_in_bundle(path)   # «висячая» ссылка — dyld всё равно не запустит приложение

              removed_cmds = strip_dylibs(buf, should_remove)
              if removed_cmds:
                  with open(exe, 'wb') as f:
                      f.write(buf)
                  os.chmod(exe, 0o755)
              rep.append('### Вырезанные load-команды')
              rep += [f'- `{p}`' for p in removed_cmds] or ['- ничего']
              rep.append('')
              rep.append('### Остальное, что осталось в базе (для справки)')
              extra = []
              for d in scan_dirs:
                  for name in sorted(os.listdir(d)):
                      if name.lower().endswith('.dylib') and not KEEP_LOOSE.match(name):
                          extra.append(os.path.relpath(os.path.join(d, name), app))
              rep += [f'- loose dylib: `{e}`' for e in extra] or ['- посторонних loose dylib нет']

              if os.path.exists(a.dst):
                  os.remove(a.dst)
              dst = os.path.abspath(a.dst)
              subprocess.check_call(['zip', '-qry', dst, 'Payload'], cwd=work)
              shutil.rmtree(work)
              with open(a.report, 'w', encoding='utf8') as f:
                  f.write('\n'.join(rep) + '\n')
              print('\n'.join(rep))


          if __name__ == '__main__':
              main()
          PYEOF
          python3 "$RUNNER_TEMP/sanitize_ipa.py" $ARGS base/SoundCloud.ipa base/SoundCloud.clean.ipa --report sanitize-report.md
          cat sanitize-report.md >> "$GITHUB_STEP_SUMMARY"
          unzip -tq base/SoundCloud.clean.ipa >/dev/null

      # cyan вставляет load command для dylib и добавляет ElleKit вместо CydiaSubstrate,
      # без которого хуки (отключение рекламы) в не-джейлбрейк IPA не работают.
      - name: Inject tweak into IPA
        run: |
          set -euo pipefail
          mkdir -p out
          cyan -i base/SoundCloud.clean.ipa -o out/SoundCloud-Customizer.ipa \
               -f inject/SCMusicPlus.dylib inject/SCMusicPlus.bundle -u

      - name: Verify result (and put bundle next to the dylib)
        run: |
          set -euo pipefail
          rm -rf res && mkdir res
          unzip -q out/SoundCloud-Customizer.ipa -d res
          APP=$(find res/Payload -maxdepth 1 -type d -name '*.app' | head -n 1)
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          echo "--- injected files"
          find "$APP" \( -name 'SCMusicPlus*' -o -iname '*substrate*' -o -iname '*ellekit*' \) -maxdepth 3
          DYLIB=$(find "$APP" -name 'SCMusicPlus.dylib' | head -n 1)
          test -n "$DYLIB" || { echo "::error::SCMusicPlus.dylib не попал в IPA"; exit 1; }
          otool -L "$APP/$EXE" | grep -i SCMusicPlus || { echo "::error::в главном бинарнике нет load command для SCMusicPlus"; exit 1; }
          echo "--- load commands результата"
          otool -L "$APP/$EXE" | tee loadcmds.txt
          {
            echo ''; echo '## Load-команды готового IPA'; echo '```'; cat loadcmds.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          N_OURS=$(grep -ci 'SCMusicPlus' loadcmds.txt || true)
          N_HOOK=$(grep -ciE 'substrate|ellekit' loadcmds.txt || true)
          [ "$N_OURS" -eq 1 ] || { echo "::error::SCMusicPlus подключён $N_OURS раз(а), должен быть ровно 1"; exit 1; }
          [ "$N_HOOK" -le 1 ] || { echo "::error::Несколько hook-библиотек (Substrate/ElleKit): $N_HOOK — приложение упадёт при запуске"; exit 1; }
          DIR=$(dirname "$DYLIB")
          if [ ! -f "$DIR/SCMusicPlus.bundle/app.html" ] \
             && [ ! -f "$APP/SCMusicPlus.bundle/app.html" ] \
             && [ ! -f "$APP/Frameworks/SCMusicPlus.bundle/app.html" ]; then
            echo "Bundle not found after cyan, copying next to dylib"
            cp -R inject/SCMusicPlus.bundle "$DIR/"
            (cd res && rm -f ../out/SoundCloud-Customizer.ipa && zip -qry ../out/SoundCloud-Customizer.ipa Payload)
          fi
          ls -lh out/
          shasum -a 256 out/SoundCloud-Customizer.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SoundCloud-Customizer-ipa
          path: out/SoundCloud-Customizer.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitize-report
          path: sanitize-report.md
          if-no-files-found: ignore
          retention-days: 14
